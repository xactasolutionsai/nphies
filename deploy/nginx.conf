limit_req_zone $binary_remote_addr zone=nafes_login:10m rate=10r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 87.237.225.69 aimedical.xactasolutions.tech;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://aimedical.xactasolutions.tech$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 87.237.225.69;
    ssl_certificate /etc/letsencrypt/live/87.237.225.69/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/87.237.225.69/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/nafes/current/frontend/dist;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /api/auth/register {
        default_type application/json;
        return 403 '{"error":"Public registration is disabled on this deployment"}';
    }
    location = /api/auth/login {
        limit_req zone=nafes_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 150s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}

